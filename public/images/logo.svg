<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="logoShieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="logoShieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="brandTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem Container -->
  <rect x="4" y="8" width="48" height="48" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Hexagonal Shield Icon -->
  <path d="M28 14 L43 21 L43 37 L28 49 L13 37 L13 21 Z" 
        fill="url(#logoShieldFill)" 
        stroke="url(#logoShieldBorder)" 
        stroke-width="2.4" 
        stroke-linejoin="round"
        filter="url(#logoGlow)"/>

  <!-- Inner Shield Accent -->
  <path d="M28 20 L38 25 L38 34 L28 41 L18 34 L18 25 Z" 
        fill="none" 
        stroke="url(#logoShieldBorder)" 
        stroke-width="1.4" 
        stroke-linejoin="round" 
        opacity="0.75"/>

  <!-- Checkmark -->
  <path d="M23 31.5 L26.8 35.2 L33.2 27.8" 
        fill="none" 
        stroke="#34d399" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Brand Typography -->
  <text x="64" y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="url(#brandTextGrad)" letter-spacing="-0.5">Jeli<tspan fill="#34d399">Pay</tspan></text>
  <text x="65" y="49" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#94a3b8" letter-spacing="1.2">P2P TOKEN PLATFORM</text>
</svg>
