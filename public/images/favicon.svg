<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Outer Hexagonal Shield -->
  <path d="M32 9 L51 18 L51 38 L32 53 L13 38 L13 18 Z" 
        fill="url(#shieldFill)" 
        stroke="url(#shieldBorder)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
        
  <!-- Inner Shield Accent -->
  <path d="M32 17 L44 23 L44 35 L32 44 L20 35 L20 23 Z" 
        fill="none" 
        stroke="url(#shieldBorder)" 
        stroke-width="1.8" 
        stroke-linejoin="round" 
        opacity="0.8"/>
        
  <!-- Checkmark -->
  <path d="M26 31 L30.5 35.5 L38.5 26.5" 
        fill="none" 
        stroke="#34d399" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
